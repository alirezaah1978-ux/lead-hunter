name: "🌐 LALIGA OMNISCOUT — کشف و تطبیق جهانی فرصت‌ها"

on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  omniscout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: نصب وابستگی‌ها
        run: pip install -q requests beautifulsoup4
      - name: اجرای ۱۷ مرحله‌ای LALIGA OMNISCOUT + ارسال هشدار تلگرام
        working-directory: engine
        run: python3 omniscout.py --send
      - name: ذخیره گزارش و وضعیت در مخزن
        if: always()
        run: |
          git config user.name "omniscout-bot"
          git config user.email "omniscout@users.noreply.github.com"
          git add engine/output/omniscout_report.json engine/output/omniscout_state.json || true
          git diff --cached --quiet || (git commit -m "chore(omniscout): update global report" && git pull --rebase && git push) || true
