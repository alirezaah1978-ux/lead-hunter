# 🏪 به‌روزرسانی لیست تأمین‌کننده‌های لوازم یدکی — هر ۱۲ ساعت
# کانال‌های عمومی تلگرام را می‌خواند و شماره‌های جدید را در فایل ذخیره می‌کند.

name: تأمین‌کننده‌های یدکی

on:
  schedule:
    - cron: "20 3,15 * * *"     # هر روز ۰۶:۵۰ و ۱۸:۵۰ تهران
  workflow_dispatch:

concurrency:
  group: parts-suppliers
  cancel-in-progress: false

jobs:
  suppliers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ساخت لیست تأمین‌کننده‌ها
        working-directory: engine
        run: python3 collect_parts_suppliers.py

      - name: آپلود فایل‌ها
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parts-suppliers
          path: |
            engine/output/parts_suppliers.csv
            engine/output/parts_prices.csv
          retention-days: 30
