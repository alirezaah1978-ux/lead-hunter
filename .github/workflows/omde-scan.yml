# 🔎 اسکن عمده‌فروشی‌های تلگرام — پست‌های زنده (پیش‌فرض: ۶ ساعت اخیر)
# فرمان دستی از ربات («اسکن») این ورک‌فلو را دیسپچ می‌کند.
# سکرت‌ها: TELEGRAM_BOT_TOKEN · TELEGRAM_CHAT_ID

name: اسکن عمده‌فروشی

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6,12,18 * * *"   # سه بار در روز

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: اسکن و ارسال خلاصه
        working-directory: engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 omde_scan.py --hours 6 --send
